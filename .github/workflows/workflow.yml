name: Unit and Integration Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: promptstudio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: promptstudio_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/promptstudio_test
      LLM_STUB_ENABLED: "true"
      LLM_STUB_LATENCY_MODE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Apply database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Run unit tests
        run: npx jest --config jest.config.cjs --runInBand

      - name: Run integration tests
        run: npm run test:integration
